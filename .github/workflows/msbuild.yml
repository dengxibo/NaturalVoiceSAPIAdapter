name: Integrated local-review build
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Restore pinned dependencies
        shell: pwsh
        run: |
          nuget restore NaturalVoiceSAPIAdapter/packages.config -PackagesDirectory packages
          if ($LASTEXITCODE) { throw 'Restore failed' }
          nuget restore Installer/packages.config -PackagesDirectory packages
          if ($LASTEXITCODE) { throw 'Restore failed' }
      - name: Build integrated review bundle without registration
        shell: pwsh
        run: |
          ./distribution/Build-Full.ps1 -PlatformToolset v143
      - name: Test secv2 algorithm without models or network synthesis
        shell: pwsh
        run: |
          foreach ($arch in @('x64','Win32')) {
            $folder = if ($arch -eq 'Win32') { 'x86' } else { 'x64' }
            msbuild tests/GecCli.vcxproj /p:Configuration=Release /p:Platform=$arch /p:PlatformToolset=v143 /p:OutDir="$PWD/out/tests/$folder/" /nologo /v:minimal
            if ($LASTEXITCODE) { throw 'Algorithm probe build failed' }
            python tests/test_gec.py "$PWD/out/tests/$folder/gec_cli.exe"
            if ($LASTEXITCODE) { throw 'Algorithm mismatch' }
          }
      # Deliberately no release/upload step for the bundle: Embedded Speech
      # distribution approval is not supplied. Never publish SDK/model payload
      # just because compilation succeeded. See docs/许可证与依赖.md.